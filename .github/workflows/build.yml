      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: app-src
        run: gradle assembleRelease --no-daemon

      - name: Preparar APK
        run: cp app-src/app/build/outputs/apk/release/app-release.apk MesaDoble.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mesa Doble 1.0.${{ github.run_number }}
          make_latest: true
          files: MesaDoble.apk
          body: Descarga MesaDoble.apk en ambos teléfonos e instálalo.
