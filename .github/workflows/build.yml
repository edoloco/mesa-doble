      - name: Número de versión (fijo para este paquete)
        # el número va dentro de este archivo: un build.yml viejo nunca puede dar una versión "más nueva"
        run: |
          echo "VERSION_CODE=29863583" >> $GITHUB_ENV
          echo "VERSION_NAME=1.261012.1123" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: app-src
        run: gradle assembleRelease --no-daemon

      - name: Preparar APKs
        run: |
          cp app-src/app/build/outputs/apk/completa/release/*.apk MesaDoble-completa.apk
          cp app-src/app/build/outputs/apk/liviana/release/*.apk MesaDoble-liviana.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Mesa Doble ${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            MesaDoble-liviana.apk
            MesaDoble-completa.apk
          body: |
            Versión 1.261012.1123. Incluye: el reloj (de la mesa y el widget) abre las alarmas aunque haya otra app al frente; el control de la cámara aparece en el extendido al abrir la cámara
            MesaDoble-liviana.apk: sin permisos sensibles, Play Protect no la bloquea. Sirve para ambos teléfonos.
            MesaDoble-completa.apk: cambia el teclado automáticamente (usa accesibilidad). Solo para el principal.
